<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXER 22641 - Practice Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0a0a;
      --card-bg: #141414;
      --card-border: #262626;
      --accent-white: #ffffff;
      --text-muted: #888888;
      --highlight-gray: #1f1f1f;
      --danger-red: #ff4d4d;
      --warn-yellow: #ffb703;
      --success-green: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--accent-white);
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header Cyber/Minimal Style */
    header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 20px;
    }

    .team-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #777777 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .sub-title {
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    /* Today Highlight Card */
    .today-hero {
      background: var(--card-bg);
      border: 1px solid var(--accent-white);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }

    .today-hero::before {
      content: "TODAY's STATUS";
      position: absolute;
      top: 12px;
      right: 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 2px;
    }

    .today-date {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .today-badge {
      background: var(--accent-white);
      color: var(--bg-main);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .today-status {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #00e676;
    }

    .today-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 15px;
    }

    .leave-box {
      background: var(--highlight-gray);
      border-left: 3px solid var(--accent-white);
      padding: 12px 16px;
      border-radius: 6px;
    }

    .leave-box.full { border-left-color: var(--danger-red); }
    .leave-box.part { border-left-color: var(--warn-yellow); }

    .leave-box h4 {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .leave-box .names {
      font-size: 1rem;
      font-weight: 600;
    }

    .leave-box .notes {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 4px;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      border-color: var(--accent-white);
      color: var(--accent-white);
    }

    .tab-btn.active {
      background: var(--accent-white);
      color: var(--bg-main);
      border-color: var(--accent-white);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }

    .refresh-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--accent-white);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: var(--highlight-gray);
    }

    /* Table Design */
    .table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.9rem;
      vertical-align: top;
    }

    th {
      background-color: #0f0f0f;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background-color: var(--highlight-gray);
    }

    .badge-cancel {
      color: var(--danger-red);
      font-weight: 600;
    }

    .text-part-time {
      color: var(--warn-yellow);
    }

    .text-full-time {
      color: var(--danger-red);
    }

    .note-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .loading-state, .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .team-title { font-size: 2rem; }
      body { padding: 16px 8px; }
      th, td { padding: 12px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="team-title">NEXER 22641</div>
      <div class="sub-title">REAL-TIME PRACTICE SCHEDULE</div>
    </header>

    <!-- Today Summary Panel -->
    <div id="today-panel" class="today-hero">
      <div class="today-date">
        <span id="today-date-text">กำลังโหลด...</span>
        <span class="today-badge">TODAY</span>
      </div>
      <div id="today-status-text" class="today-status">-</div>
      <div class="today-grid" id="today-leave-details">
        <!-- JS will populate leave details for today -->
      </div>
    </div>

    <!-- Page Switcher -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('upcoming')">📅 ตารางซ้อมปัจจุบัน/อนาคต</button>
      <button class="tab-btn" onclick="switchTab('history')">📜 ประวัติการซ้อม (History)</button>
    </div>

    <div class="controls">
      <div id="view-title" class="section-title">SCHEDULE</div>
      <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
    </div>

    <!-- Main Table -->
    <div class="table-wrap">
      <div id="loading" class="loading-state">FETCHING DATA FROM GOOGLE SHEETS...</div>
      <table id="main-table" style="display: none;">
        <thead>
          <tr>
            <th>วันที่</th>
            <th>วัน</th>
            <th>สถานะการซ้อม</th>
            <th>ผู้ลา (ทั้งวัน)</th>
            <th>หมายเหตุ</th>
            <th>ผู้ลา (เจาะจงเวลา)</th>
            <th>หมายเหตุ</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SHEET_ID = '1T1CSPLRSY6X1RDMv3feAFZ0hSMVFSjOz8nWOjkjjjcE';
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

    let allRows = [];
    let currentTab = 'upcoming';

    const thaiMonths = {
      'ม.ค.': 0, 'ก.พ.': 1, 'มี.ค.': 2, 'เม.ย.': 3,
      'พ.ค.': 4, 'มิ.ย.': 5, 'ก.ค.': 6, 'ส.ค.': 7,
      'ก.ย.': 8, 'ต.ค.': 9, 'พ.ย.': 10, 'ธ.ค.': 11
    };

    function parseThaiDate(str) {
      if (!str) return null;
      const clean = str.trim().split(/\s+/);
      if (clean.length < 3) return null;

      const day = parseInt(clean[0], 10);
      const monthIndex = thaiMonths[clean[1]];
      let yearBE = parseInt(clean[2], 10);
      if (yearBE < 100) yearBE += 2500;
      const yearAD = yearBE - 543;

      if (isNaN(day) || monthIndex === undefined || isNaN(yearAD)) return null;
      return new Date(yearAD, monthIndex, day);
    }

    function parseCSV(text) {
      const lines = text.split('\n');
      const data = [];

      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const matches = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
        const clean = matches.map(m => m.replace(/^"|"$/g, '').trim());

        if (clean[0]) {
          data.push({
            dateStr: clean[0] || '',
            dayOfWeek: clean[1] || '',
            status: clean[2] || '',
            fullLeaveNames: clean[3] || '',
            fullLeaveNotes: clean[4] || '',
            partLeaveNames: clean[5] || '',
            partLeaveNotes: clean[6] || '',
            dateObj: parseThaiDate(clean[0])
          });
        }
      }
      return data;
    }

    async function loadData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('main-table').style.display = 'none';

      try {
        const response = await fetch(CSV_URL);
        const text = await response.text();
        allRows = parseCSV(text);
        renderTodayHero();
        renderTable();
      } catch (err) {
        document.getElementById('loading').innerText = '❌ FAILED TO LOAD SCHEDULE DATA';
        console.error(err);
      }
    }

    function renderTodayHero() {
      const today = new Date();
      today.setHours(0,0,0,0);

      const todayData = allRows.find(row => row.dateObj && row.dateObj.getTime() === today.getTime());
      const leaveContainer = document.getElementById('today-leave-details');

      if (todayData) {
        document.getElementById('today-date-text').innerText = `${todayData.dateStr} (${todayData.dayOfWeek})`;
        document.getElementById('today-status-text').innerText = `สถานะ: ${todayData.status || 'มีการซ้อมปกติ'}`;
        
        let html = '';
        if (todayData.fullLeaveNames) {
          html += `
            <div class="leave-box full">
              <h4>⛔ ลาทั้งวัน</h4>
              <div class="names text-full-time">${todayData.fullLeaveNames}</div>
              <div class="notes">${todayData.fullLeaveNotes || '-'}</div>
            </div>`;
        }
        if (todayData.partLeaveNames) {
          html += `
            <div class="leave-box part">
              <h4>⏳ ลาบางช่วงเวลา</h4>
              <div class="names text-part-time">${todayData.partLeaveNames}</div>
              <div class="notes">${todayData.partLeaveNotes || '-'}</div>
            </div>`;
        }

        if (!todayData.fullLeaveNames && !todayData.partLeaveNames) {
          html = '<div style="color: var(--text-muted);">🎉 วันนี้ไม่มีแจ้งลาเพิ่มเติม</div>';
        }

        leaveContainer.innerHTML = html;
      } else {
        document.getElementById('today-date-text').innerText = 'วันนี้ไม่มีตารางในระบบ';
        document.getElementById('today-status-text').innerText = '-';
        leaveContainer.innerHTML = '<div style="color: var(--text-muted);">ไม่มีข้อมูลสำหรับวันนี้</div>';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      const today = new Date();
      today.setHours(0,0,0,0);

      // กรองข้อมูล: ปัจจุบัน/อนาคต (รวมวันนี้) VS ประวัติ (ก่อนวันนี้)
      const filtered = allRows.filter(row => {
        if (!row.dateObj) return true;
        return currentTab === 'upcoming' ? row.dateObj >= today : row.dateObj < today;
      });

      filtered.sort((a,b) => {
        if (!a.dateObj || !b.dateObj) return 0;
        return currentTab === 'upcoming' ? a.dateObj - b.dateObj : b.dateObj - a.dateObj;
      });

      document.getElementById('loading').style.display = 'none';

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">NO SCHEDULE FOUND IN THIS SECTION</td></tr>`;
      } else {
        filtered.forEach(row => {
          const tr = document.createElement('tr');
          const isToday = row.dateObj && row.dateObj.getTime() === today.getTime();

          let statusClass = row.status.includes('งดซ้อม') ? 'class="badge-cancel"' : '';

          tr.innerHTML = `
            <td>
              <strong>${row.dateStr}</strong>
              ${isToday ? ' <span class="today-badge">TODAY</span>' : ''}
            </td>
            <td>${row.dayOfWeek}</td>
            <td ${statusClass}>${row.status || '-'}</td>
            <td class="text-full-time">${row.fullLeaveNames || '-'}</td>
            <td class="note-sub">${row.fullLeaveNotes || '-'}</td>
            <td class="text-part-time">${row.partLeaveNames || '-'}</td>
            <td class="note-sub">${row.partLeaveNotes || '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('main-table').style.display = 'table';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      if (tab === 'upcoming') {
        event.target.classList.add('active');
        document.getElementById('view-title').innerText = 'UPCOMING SCHEDULE';
      } else {
        event.target.classList.add('active');
        document.getElementById('view-title').innerText = 'PRACTICE HISTORY';
      }
      renderTable();
    }

    loadData();
  </script>
</body>
</html>
